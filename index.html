<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇵🇭 PH Congress Dynasty Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9922A;--gold-light:#F0C96A;--gold-dim:#8B6520;--navy:#0A1628;--navy2:#112240;--navy3:#1A3357;--surface:#0F1F38;--surface2:#162848;--surface3:#1E3254;--text:#E8EDF5;--text2:#A8B8CC;--text3:#6A82A0;--red:#E05252;--green:#3CB07A;--blue:#4A9EE0;--purple:#9B72CF;--border:#1E3254;--radius:12px;--dynasty-bg:#2A1A08;--dynasty-border:#8B6520}
html{scroll-behavior:smooth}body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;overflow-x:hidden}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--navy2)}::-webkit-scrollbar-thumb{background:var(--navy3);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--gold-dim)}
.header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 50%,#0D1F3C 100%);border-bottom:1px solid var(--gold-dim);padding:0 32px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:16px}.logo{display:flex;align-items:center;gap:12px;min-width:270px}.logo-flag{font-size:28px}.logo-text{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--gold-light);letter-spacing:.5px}.logo-sub{font-size:11px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}.nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.nav-btn{padding:8px 13px;border:none;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;transition:all .2s;letter-spacing:.3px}.nav-btn:hover,.nav-btn.active{background:var(--surface3);color:var(--gold-light)}
.main{padding:28px 32px;max-width:1600px;margin:0 auto}.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:28px}.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s}.kpi-card:hover{border-color:var(--gold-dim);transform:translateY(-2px)}.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-bar,var(--gold))}.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:500;margin-bottom:8px}.kpi-value{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;color:var(--text);line-height:1}.kpi-sub{font-size:12px;color:var(--text3);margin-top:6px}.kpi-icon{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:32px;opacity:.15}.kpi-trend{font-size:11px;margin-top:4px;font-weight:600;color:var(--text3)}
.search-panel,.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:24px}.search-title,.panel-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--gold-light);margin-bottom:16px;display:flex;align-items:center;gap:8px}.search-grid{display:grid;grid-template-columns:2fr 1.5fr 1.5fr 1fr;gap:12px;align-items:end}.field-group{display:flex;flex-direction:column;gap:6px}.field-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);font-weight:500}.search-input,.search-select{background:var(--navy2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;width:100%;outline:none;transition:border-color .2s}.search-input:focus,.search-select:focus{border-color:var(--gold-dim)}.search-input::placeholder{color:var(--text3)}.search-select option{background:var(--navy2)}.btn{padding:10px 20px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px}.btn-ghost{background:transparent;color:var(--text3);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--text3);color:var(--text)}.search-actions{display:flex;gap:8px}.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:20px;width:fit-content}.tab{padding:8px 20px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;border:none;background:transparent;color:var(--text3)}.tab.active{background:var(--surface3);color:var(--gold-light)}
.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.results-count{font-size:13px;color:var(--text3)}.results-count span{color:var(--gold-light);font-weight:600}.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}.person-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}.person-card:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}.person-card.dynasty{border-color:var(--dynasty-border);background:var(--dynasty-bg)}.person-card.dynasty::after{content:'👑';position:absolute;top:14px;right:14px;font-size:16px;opacity:.7}.pc-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px;padding-right:28px}.pc-name2{font-size:12px;color:var(--text3);margin-bottom:10px;font-family:'DM Mono',monospace}.pc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tag{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500;letter-spacing:.3px}.tag-region{background:#1E2F48;color:#7BADD4}.tag-dynasty{background:var(--dynasty-bg);color:var(--gold);border:1px solid var(--dynasty-border)}.tag-clan{background:#2A1F00;color:var(--gold-light)}.pc-stats{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}.pc-stat{text-align:center}.pc-stat-val{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--text)}.pc-stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.district-table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}table{width:100%;border-collapse:collapse;font-size:13px}thead th{background:var(--surface2);color:var(--text2);font-weight:600;padding:12px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;z-index:2}tbody tr{border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer}tbody tr:hover{background:var(--surface2)}tbody tr.region-row{background:var(--surface3)}tbody tr.region-row td{color:var(--gold-light);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:10px 14px}tbody td{padding:10px 14px;color:var(--text2);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}tbody td:first-child{color:var(--text);font-weight:500}.dynasty-cell{color:var(--gold)!important;font-weight:600!important}.clickable:hover{color:var(--gold-light)}
.pagination{display:flex;gap:8px;justify-content:center;margin-top:24px;flex-wrap:wrap}.page-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text3);font-size:13px;cursor:pointer;transition:all .2s}.page-btn:hover,.page-btn.active{background:var(--surface3);color:var(--gold-light);border-color:var(--gold-dim)}.page-btn:disabled{opacity:.4;cursor:default}.empty{text-align:center;padding:60px 20px;color:var(--text3)}.empty-icon{font-size:40px;margin-bottom:12px}.empty-text{font-size:15px}.fade-in{animation:fadeIn .3s ease-out forwards}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.dynasty-card{background:var(--dynasty-bg);border:1px solid var(--dynasty-border);border-radius:14px;padding:20px;margin-bottom:18px}.dynasty-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:14px}.dynasty-name{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold-light)}.dynasty-meta{font-size:12px;color:var(--text3);margin-top:3px}.dynasty-score{font-family:'DM Mono',monospace;font-size:36px;color:var(--gold);opacity:.7}.relation-chip{display:inline-flex;margin:0 6px 8px 0;padding:4px 9px;border-radius:999px;background:rgba(201,146,42,.12);border:1px solid rgba(201,146,42,.35);color:var(--gold-light);font-size:11px}.relation-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.relation-box{background:rgba(10,22,40,.6);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;color:var(--text2);line-height:1.5}.relation-title{font-weight:700;color:var(--gold-light);margin-bottom:4px}.network-wrap{background:rgba(10,22,40,.6);border:1px solid var(--border);border-radius:12px;margin:14px 0;padding:10px}.network-svg{width:100%;height:260px}.network-line{stroke-width:2;opacity:.55}.network-line.shared{stroke:var(--gold)}.network-line.succession{stroke:var(--green)}.network-line.overlap{stroke:var(--purple)}.network-node{fill:var(--surface3);stroke:var(--gold);stroke-width:2}.network-node.main{fill:var(--gold);stroke:var(--gold-light)}.network-text{fill:var(--text2);font-size:10px;font-family:'DM Sans',sans-serif}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text3);padding:0 6px 4px}.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.member-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:12px}.member-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--navy2);border:1px solid rgba(255,255,255,.04);border-radius:8px;cursor:pointer}.member-row:hover{background:var(--surface3)}.section-divider{height:1px;background:var(--border);margin:24px 0}.bar-list{display:flex;flex-direction:column;gap:8px}.bar-row{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:12px;color:var(--text2)}.bar-bg{height:8px;background:var(--navy2);border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:var(--gold);border-radius:999px}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}.modal-overlay.open{opacity:1;pointer-events:all}.modal{background:var(--navy2);border:1px solid var(--border);border-radius:16px;max-width:900px;width:100%;max-height:88vh;overflow-y:auto;transform:translateY(20px);transition:transform .25s}.modal-overlay.open .modal{transform:translateY(0)}.modal-header{padding:28px 32px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:var(--navy2);z-index:1}.modal-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:4px}.modal-name2{font-size:13px;color:var(--text3);font-family:'DM Mono',monospace}.modal-close{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}.modal-close:hover{background:var(--surface3);color:var(--text)}.modal-body{padding:24px 32px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}.info-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px}.info-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:4px}.info-val{font-size:14px;color:var(--text);font-weight:500}.info-val.dynasty{color:var(--gold)}.section-head{font-family:'Playfair Display',serif;font-size:15px;color:var(--gold-light);margin-bottom:12px}.timeline{display:flex;flex-direction:column}.tl-item{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:4px;flex-shrink:0}.tl-period{font-family:'DM Mono',monospace;font-size:13px;color:var(--gold-light);min-width:140px}.tl-detail{font-size:13px;color:var(--text2)}
@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(3,1fr)}.relation-grid{grid-template-columns:1fr}.header{height:auto;padding:12px 16px;align-items:flex-start;flex-direction:column}.nav{justify-content:flex-start}.search-grid{grid-template-columns:1fr 1fr}}@media(max-width:800px){.search-grid{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}.main{padding:16px}.person-grid{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.bar-row{grid-template-columns:105px 1fr 48px}.logo{min-width:0}.modal-body{padding:20px}.modal-header{padding:22px}}
</style>
</head>
<body>
<header class="header">
  <div class="logo"><span class="logo-flag">🇵🇭</span><div><div class="logo-text">PH Congress Dynasty Tracker</div><div class="logo-sub">8th – 20th Congress · Political Families Network</div></div></div>
  <nav class="nav">
    <button class="nav-btn active" onclick="showView('search')">🔍 Search</button>
    <button class="nav-btn" onclick="showView('districts')">🗺️ Districts</button>
    <button class="nav-btn" onclick="showView('dynasties')">👑 Dynasties</button>
    <button class="nav-btn" onclick="showView('congress')">📜 Congress</button>
  </nav>
</header>
<main class="main">
  <div class="kpi-row" id="kpiRow"></div>

  <div id="view-search">
    <div class="search-panel">
      <div class="search-title">🔍 Search & Filter Legislators</div>
      <div class="search-grid">
        <div class="field-group"><label class="field-label">Search by Name</label><input class="search-input" id="nameInput" placeholder="e.g. Marcos, Aquino, Bong, Aurora Abad…" oninput="debounceSearch()"></div>
        <div class="field-group"><label class="field-label">Filter by District / Region</label><input class="search-input" id="districtInput" placeholder="e.g. Lone, 1st District, Batanes…" oninput="debounceSearch()"></div>
        <div class="field-group"><label class="field-label">Filter by Congress</label><select class="search-select" id="congressSelect" onchange="doSearch()"><option value="">All Congresses</option></select></div>
        <div class="field-group"><label class="field-label">Filter</label><div class="search-actions"><select class="search-select" id="filterSelect" onchange="doSearch()" style="flex:1"><option value="">All</option><option value="dynasty">Dynasty Only</option><option value="multiterm">3+ Terms</option><option value="singleDistrict">Single District</option></select><button class="btn btn-ghost" onclick="clearSearch()">✕</button></div></div>
      </div>
    </div>
    <div class="tabs"><button class="tab active" onclick="setCardView('cards',this)">⊞ Cards</button><button class="tab" onclick="setCardView('table',this)">≡ Table</button></div>
    <div class="results-header"><div class="results-count" id="resultsCount">Loading…</div></div>
    <div id="cardsView"></div><div id="tableView" style="display:none"></div><div class="pagination" id="pagination"></div>
  </div>

  <div id="view-districts" style="display:none">
    <div class="search-panel">
      <div class="search-title">🗺️ District Representative History</div>
      <div class="search-grid" style="grid-template-columns:2fr 1.5fr 1fr">
        <div class="field-group"><label class="field-label">Search District or Province</label><input class="search-input" id="dSearchInput" placeholder="e.g. Manila, Batanes, Cebu, 1st District…" oninput="renderDistricts()"></div>
        <div class="field-group"><label class="field-label">Filter by Region</label><select class="search-select" id="dRegionSelect" onchange="renderDistricts()"><option value="">All Regions</option></select></div>
        <div class="field-group"><label class="field-label">Congress</label><select class="search-select" id="dCongressSelect" onchange="renderDistricts()"><option value="">All Congresses</option></select></div>
      </div>
    </div>
    <div class="district-table-wrap"><table><thead id="districtThead"></thead><tbody id="districtTbody"></tbody></table></div>
  </div>

  <div id="view-dynasties" style="display:none">
    <div class="search-panel">
      <div class="search-title">👑 Political Dynasty Network</div>
      <div class="search-grid" style="grid-template-columns:2fr 1fr 1fr auto">
        <div class="field-group"><label class="field-label">Search Family / Surname</label><input class="search-input" id="clanSearchInput" placeholder="e.g. Marcos, Aquino, Romualdez…" oninput="renderDynasties()"></div>
        <div class="field-group"><label class="field-label">Min Members</label><select class="search-select" id="clanMinSelect" onchange="renderDynasties()"><option value="2">2+</option><option value="3">3+</option><option value="5">5+</option><option value="7">7+</option></select></div>
        <div class="field-group"><label class="field-label">Sort</label><select class="search-select" id="clanSortSelect" onchange="renderDynasties()"><option value="members">Most Members</option><option value="seats">Most Seats</option><option value="connections">Most Connected</option><option value="recent">Most Recent</option></select></div>
        <div class="field-group"><label class="field-label">&nbsp;</label><button class="btn btn-ghost" onclick="document.getElementById('clanSearchInput').value='';renderDynasties()">✕ Clear</button></div>
      </div>
    </div>
    <div id="dynastyContent"></div>
  </div>

  <div id="view-congress" style="display:none">
    <div class="search-panel">
      <div class="search-title">📜 Browse by Congress Period</div>
      <div class="search-grid" style="grid-template-columns:1.5fr 1fr 1fr">
        <div class="field-group"><label class="field-label">Select Congress</label><select class="search-select" id="cCongressSelect" onchange="renderCongressView()"><option value="">Select a congress period…</option></select></div>
        <div class="field-group"><label class="field-label">Filter by Region</label><select class="search-select" id="cRegionSelect" onchange="renderCongressView()"><option value="">All Regions</option></select></div>
        <div class="field-group"><label class="field-label">Search Overview</label><input class="search-input" id="cSearchInput" placeholder="Search congress overview…" oninput="renderCongressView()"></div>
      </div>
    </div>
    <div id="congressContent"></div>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal"><div class="modal-header"><div><div class="modal-name" id="modalName"></div><div class="modal-name2" id="modalName2"></div></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div></div>
</div>

<script>
const ALL_CONGRESSES=['8th Congress','9th Congress','10th Congress','11th Congress','12th Congress','13th Congress','14th Congress','15th Congress','16th Congress','17th Congress','18th Congress','19th Congress','20th Congress'];
const PAGE_SIZE=24;
const DB={p:[],d:[],o:[],dynasties:[],analytics:{}};
let ALL_REGIONS=[],searchResults=[],currentPage=1,cardMode='cards',debounceTimer=null,currentView='search';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const asArray=v=>Array.isArray(v)?v:(v?[v]:[]);
function congressNum(c){return parseInt(c)||0} function congressIndex(c){return ALL_CONGRESSES.indexOf(c)}
function surnameOf(name){let s=String(name||'').trim(); if(!s)return 'Unknown'; let first=s.includes(',')?s.split(',')[0]:s.split(/\s+/)[0]; return first.replace(/[^A-Za-zÀ-žÑñ' -]/g,'').trim()||'Unknown'}
function memberLabel(p){return surnameOf(p.fn||p.name).slice(0,12)}
async function loadJson(path){const r=await fetch(path); if(!r.ok)throw new Error(path+' failed to load'); return r.json()}
async function init(){
  $('kpiRow').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--text3)"><div style="font-size:28px;margin-bottom:12px">⏳</div><div style="font-size:15px;font-weight:500">Loading Congress data…</div></div>`;
  try{
    const [reps,districts,overview]=await Promise.all([loadJson('data/representatives.json'),loadJson('data/districts.json'),loadJson('data/congress_overview.json')]);
    DB.d=districts; DB.o=overview; prepareRepresentatives(reps); buildDynastyModel(); buildAnalytics(); populateSelects(); buildKPIs(); doSearch(); renderDistrictHeader(); renderDistricts();
  }catch(e){$('kpiRow').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--red)"><div style="font-size:28px;margin-bottom:12px">⚠️</div><div style="font-weight:700">Could not load local data files.</div><div style="font-size:12px;color:var(--text3);margin-top:6px">Make sure data/representatives.json, data/districts.json, and data/congress_overview.json are uploaded beside this index.html.</div></div>`; console.error(e)}
}
function prepareRepresentatives(reps){
  const byName=new Map();
  for(const r of reps){const id=r.id||norm(r.name).replace(/ /g,'-'); const p={...r,id,fn:r.name||r.fn||'',aliases:r.aliases||[],tr:r.congresses||[],tt:r.term_count||asArray(r.congresses).length,regions:r.regions||[],districts:r.districts||[],terms:r.terms||[],surname:surnameOf(r.name||r.fn)}; p.rg=p.regions[0]||''; p.di=p.districts[0]||''; byName.set(norm(p.fn),p);}
  for(const d of DB.d){for(const [cong,names] of Object.entries(d.history||{})){for(const name of asArray(names)){const key=norm(name); let p=byName.get(key); if(!p){p={id:key.replace(/ /g,'-')||Math.random().toString(36).slice(2),fn:name,aliases:[],tr:[],tt:0,regions:[],districts:[],terms:[],surname:surnameOf(name),synthetic:true}; byName.set(key,p)} if(!p.tr.includes(cong))p.tr.push(cong); if(!p.regions.includes(d.region))p.regions.push(d.region); if(!p.districts.includes(d.district))p.districts.push(d.district); p.terms.push({congress:cong,region:d.region,district:d.district,name_used:name});}}
  }
  DB.p=[...byName.values()].map(p=>{p.tr=[...new Set(p.tr)].sort((a,b)=>congressNum(a)-congressNum(b)); p.tt=p.tr.length; p.rg=p.regions[0]||''; p.di=p.districts[0]||''; p.first=p.tr[0]||''; p.last=p.tr[p.tr.length-1]||''; return p}).sort((a,b)=>a.fn.localeCompare(b.fn));
}
function buildDynastyModel(){
  const groups={}; DB.p.forEach(p=>{(groups[p.surname] ||= []).push(p)});
  for(const [name,members] of Object.entries(groups)){if(members.length<2)continue; members.forEach(p=>{p.dy=true;p.cl=name});}
  DB.dynasties=Object.entries(groups).filter(([,m])=>m.length>=2).map(([name,members])=>makeDynasty(name,members));
  DB.p.forEach(p=>{p.relations=DB.dynasties.find(d=>d.name===p.cl)});
}
function makeDynasty(name,members){
  const seatCount=members.reduce((s,p)=>s+p.tr.length,0), regions=[...new Set(members.flatMap(p=>p.regions))].sort(), districts=[...new Set(members.flatMap(p=>p.districts))].sort();
  const sharedDistricts=districts.map(dist=>({district:dist,people:members.filter(p=>p.districts.includes(dist))})).filter(x=>x.people.length>=2);
  const overlaps=[]; for(const c of ALL_CONGRESSES){const people=members.filter(p=>p.tr.includes(c)); if(people.length>=2)overlaps.push({congress:c,people})}
  const successions=[]; for(const dist of districts){for(let i=0;i<ALL_CONGRESSES.length-1;i++){const a=ALL_CONGRESSES[i],b=ALL_CONGRESSES[i+1]; const from=members.find(p=>p.terms.some(t=>t.district===dist&&t.congress===a)); const to=members.find(p=>p.terms.some(t=>t.district===dist&&t.congress===b)); if(from&&to&&from.id!==to.id)successions.push({district:dist,from,to,fromCongress:a,toCongress:b})}}
  const first=members.map(p=>p.first).sort((a,b)=>congressNum(a)-congressNum(b))[0]||'', last=members.map(p=>p.last).sort((a,b)=>congressNum(b)-congressNum(a))[0]||'';
  return {name,members:members.sort((a,b)=>b.tt-a.tt||a.fn.localeCompare(b.fn)),count:members.length,seatCount,regions,districts,sharedDistricts,overlaps,successions,first,last,connectionScore:sharedDistricts.length+overlaps.length+successions.length};
}
function buildAnalytics(){
  const total=DB.p.length, dyn=DB.p.filter(p=>p.dy).length, surnames=[...new Set(DB.p.map(p=>p.surname))], dynFamilies=DB.dynasties.length, largest=[...DB.dynasties].sort((a,b)=>b.count-a.count)[0];
  const seatTerms=DB.p.reduce((s,p)=>s+p.tr.length,0), dynSeatTerms=DB.p.filter(p=>p.dy).reduce((s,p)=>s+p.tr.length,0);
  const byCongress=ALL_CONGRESSES.map(c=>{const m=DB.p.filter(p=>p.tr.includes(c)), d=m.filter(p=>p.dy).length; return {congress:c,total:m.length,dyn:d,pct:m.length?d/m.length*100:0}});
  const byRegion={}; DB.p.forEach(p=>p.regions.forEach(r=>{byRegion[r] ||= {region:r,total:0,dyn:0}; byRegion[r].total++; if(p.dy)byRegion[r].dyn++;}));
  const denseRegions=Object.values(byRegion).map(r=>({...r,pct:r.total?r.dyn/r.total*100:0})).sort((a,b)=>b.pct-a.pct||b.dyn-a.dyn);
  DB.analytics={total,dyn,dynPct:total?dyn/total*100:0,surnames:surnames.length,dynFamilies,familyPct:surnames.length?dynFamilies/surnames.length*100:0,largest,seatTerms,dynSeatTerms,dynSeatPct:seatTerms?dynSeatTerms/seatTerms*100:0,byCongress,denseRegions};
  ALL_REGIONS=[...new Set([...DB.d.map(d=>d.region),...DB.p.flatMap(p=>p.regions)].filter(Boolean))].sort();
}
function buildKPIs(){const a=DB.analytics, latest=a.byCongress[a.byCongress.length-1]||{}; $('kpiRow').innerHTML=[
  {label:'Largest Dynasty',val:a.largest?a.largest.count:'—',sub:a.largest?`${a.largest.name} family`:'—',icon:'👑',accent:'var(--gold)',trend:a.largest?`${a.largest.seatCount} seat-terms`:''},
  {label:'Dynasty-held Seats',val:a.dynSeatPct.toFixed(1)+'%',sub:`${a.dynSeatTerms} of ${a.seatTerms} seat-terms`,icon:'📊',accent:'var(--red)',trend:`Latest: ${(latest.pct||0).toFixed(1)}% in ${latest.congress||'—'}`},
  {label:'Dynasty Families',val:a.dynFamilies,sub:`${a.familyPct.toFixed(1)}% of surnames`,icon:'🏰',accent:'var(--purple)',trend:`${a.surnames} distinct surnames tracked`},
  {label:'Dynasty Members',val:a.dyn,sub:`out of ${a.total} representatives`,icon:'⚜️',accent:'var(--gold-light)',trend:`${a.dynPct.toFixed(1)}% of people tracked`},
  {label:'Densest Region',val:a.denseRegions[0]?a.denseRegions[0].pct.toFixed(0)+'%':'—',sub:a.denseRegions[0]?a.denseRegions[0].region:'—',icon:'🗺️',accent:'var(--green)',trend:a.denseRegions[0]?`${a.denseRegions[0].dyn} dynasty-linked reps`:''}
].map(k=>`<div class="kpi-card" style="--accent-bar:${k.accent}"><div class="kpi-icon">${k.icon}</div><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.val}</div><div class="kpi-sub">${esc(k.sub)}</div><div class="kpi-trend">${esc(k.trend)}</div></div>`).join('')}
function populateSelects(){['congressSelect','dCongressSelect','cCongressSelect'].forEach(id=>{const s=$(id); if(!s)return; const first=s.options[0].outerHTML; s.innerHTML=first+ALL_CONGRESSES.slice().reverse().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}); ['dRegionSelect','cRegionSelect'].forEach(id=>{const s=$(id); if(!s)return; const first=s.options[0].outerHTML; s.innerHTML=first+ALL_REGIONS.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')})}
function debounceSearch(){clearTimeout(debounceTimer);debounceTimer=setTimeout(doSearch,180)}
function doSearch(){const q=norm($('nameInput').value), dq=norm($('districtInput').value), cong=$('congressSelect').value, filt=$('filterSelect').value; searchResults=DB.p.filter(p=>{if(q&&!norm([p.fn,p.surname,...p.aliases].join(' ')).includes(q))return false; if(dq&&!norm([...p.regions,...p.districts].join(' ')).includes(dq))return false; if(cong&&!p.tr.includes(cong))return false; if(filt==='dynasty'&&!p.dy)return false; if(filt==='multiterm'&&p.tt<3)return false; if(filt==='singleDistrict'&&p.districts.length!==1)return false; return true}).sort((a,b)=>Number(b.dy)-Number(a.dy)||b.tt-a.tt||a.fn.localeCompare(b.fn)); currentPage=1; renderResults()}
function clearSearch(){['nameInput','districtInput'].forEach(id=>$(id).value=''); ['congressSelect','filterSelect'].forEach(id=>$(id).value=''); doSearch()}
function renderResults(){const total=searchResults.length,start=(currentPage-1)*PAGE_SIZE,page=searchResults.slice(start,start+PAGE_SIZE); $('resultsCount').innerHTML=`Showing <span>${Math.min(start+PAGE_SIZE,total).toLocaleString()}</span> of <span>${total.toLocaleString()}</span> legislators`; cardMode==='cards'?renderCards(page):renderTable(page); renderPagination(total)}
function renderCards(items){$('cardsView').style.display='';$('tableView').style.display='none';$('cardsView').innerHTML=items.length?`<div class="person-grid fade-in">${items.map(personCard).join('')}</div>`:emptyState('🔍','No legislators found.')}
function personCard(p){const first=p.first||'—',last=p.last||'—';return `<div class="person-card ${p.dy?'dynasty':''}" onclick="openModal('${esc(p.id)}')"><div class="pc-name">${esc(p.fn)}</div><div class="pc-name2">${esc(p.surname)}${p.synthetic?' · districts file':''}</div><div class="pc-tags">${p.rg?`<span class="tag tag-region">${esc(p.rg)}</span>`:''}${p.dy?`<span class="tag tag-dynasty">👑 Dynasty</span><span class="tag tag-clan">${esc(p.cl)}</span>`:''}</div><div class="pc-stats"><div class="pc-stat"><div class="pc-stat-val">${p.tt}</div><div class="pc-stat-lbl">Terms</div></div><div class="pc-stat" style="text-align:left;flex:1;padding-left:16px"><div style="font-size:11px;color:var(--text3)">First: ${esc(first)}</div><div style="font-size:11px;color:var(--text3)">Last: ${esc(last)}</div></div></div></div>`}
function renderTable(items){$('cardsView').style.display='none';$('tableView').style.display=''; $('tableView').innerHTML=items.length?`<div class="district-table-wrap"><table><thead><tr><th>Full Name</th><th>Family</th><th>Region</th><th>Districts</th><th>Dynasty</th><th>Terms</th><th>Last Congress</th></tr></thead><tbody>${items.map(p=>`<tr onclick="openModal('${esc(p.id)}')"><td>${esc(p.fn)}</td><td>${esc(p.surname)}</td><td>${esc(p.regions.join('; ')||'—')}</td><td>${esc(p.districts.join('; ')||'—')}</td><td class="${p.dy?'dynasty-cell':''}">${p.dy?esc(p.cl):'—'}</td><td>${p.tt}</td><td>${esc(p.last||'—')}</td></tr>`).join('')}</tbody></table></div>`:emptyState('🔍','No results found.')}
function renderPagination(total){const pages=Math.ceil(total/PAGE_SIZE); if(pages<=1){$('pagination').innerHTML='';return} let html=`<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`; pageRange(currentPage,pages).forEach(p=>html+=p==='…'?`<span style="padding:6px 4px;color:var(--text3)">…</span>`:`<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`); html+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`; $('pagination').innerHTML=html}
function pageRange(cur,total){if(total<=7)return Array.from({length:total},(_,i)=>i+1); if(cur<=4)return [1,2,3,4,5,'…',total]; if(cur>=total-3)return [1,'…',total-4,total-3,total-2,total-1,total]; return [1,'…',cur-1,cur,cur+1,'…',total]}
function goPage(p){const pages=Math.ceil(searchResults.length/PAGE_SIZE); if(p<1||p>pages)return; currentPage=p; renderResults(); window.scrollTo({top:180,behavior:'smooth'})}
function setCardView(mode,btn){cardMode=mode; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); renderResults()}
function emptyState(icon,text){return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-text">${esc(text)}</div></div>`}
function findPersonByName(name){const key=norm(name); return DB.p.find(p=>norm(p.fn)===key)||DB.p.find(p=>p.terms.some(t=>norm(t.name_used)===key))||null}
function openModal(id){const p=DB.p.find(x=>x.id===id)||findPersonByName(id); if(!p)return; $('modalName').textContent=p.fn; $('modalName2').textContent=`${p.surname}${p.dy?' · '+p.cl+' family':''}${p.synthetic?' · districts file':''}`; const info=[['Family / Surname',p.surname,p.dy?'dynasty':''],['Region(s)',p.regions.join('; ')||'—',''],['District(s)',p.districts.join('; ')||'—',''],['Dynasty Group',p.dy?p.cl:'None',p.dy?'dynasty':''],['Total Terms',p.tt,''],['First Congress',p.first||'—',''],['Last Congress',p.last||'—',''],['Source',p.synthetic?'District data':'Representative data','']]; let html=`<div class="info-grid">${info.map(i=>`<div class="info-item"><div class="info-lbl">${esc(i[0])}</div><div class="info-val ${i[2]}">${esc(i[1])}</div></div>`).join('')}</div>`; if(p.terms.length){html+=`<div class="section-head">📅 Congress Timeline</div><div class="timeline">${p.terms.sort((a,b)=>congressNum(a.congress)-congressNum(b.congress)).map(t=>`<div class="tl-item"><div class="tl-dot"></div><div class="tl-period">${esc(t.congress)}</div><div class="tl-detail">${esc(t.region)} · ${esc(t.district)}<br><span style="color:var(--text3)">Name used: ${esc(t.name_used)}</span></div></div>`).join('')}</div>`} if(p.dy&&p.relations){html+=`<div class="section-divider"></div><div class="section-head">🔗 Dynasty Connections — ${esc(p.cl)} Family</div>${renderRelationshipBoxes(p.relations,p)}${renderNetwork(p.relations,p.id)}`} $('modalBody').innerHTML=html; $('modalOverlay').classList.add('open'); document.body.style.overflow='hidden'}
function closeModal(e){if(e&&e.target!==$('modalOverlay'))return; $('modalOverlay').classList.remove('open'); document.body.style.overflow=''}
function renderRelationshipBoxes(d,focus){const shared=d.sharedDistricts.filter(x=>!focus||x.people.some(p=>p.id===focus.id)).slice(0,3), overlaps=d.overlaps.filter(x=>!focus||x.people.some(p=>p.id===focus.id)).slice(0,3), succ=d.successions.filter(x=>!focus||x.from.id===focus.id||x.to.id===focus.id).slice(0,3); return `<div class="relation-grid"><div class="relation-box"><div class="relation-title">🏛 Shared District</div>${shared.length?shared.map(x=>`${esc(x.district)} — ${x.people.length} members`).join('<br>'):'No direct shared-district signal found.'}</div><div class="relation-box"><div class="relation-title">🔁 Possible Succession</div>${succ.length?succ.map(x=>`${esc(x.fromCongress)} ${esc(x.from.fn)} → ${esc(x.toCongress)} ${esc(x.to.fn)}`).join('<br>'):'No consecutive-term signal found.'}</div><div class="relation-box"><div class="relation-title">🤝 Overlap</div>${overlaps.length?overlaps.map(x=>`${esc(x.congress)} — ${x.people.map(p=>esc(p.fn)).join(' + ')}`).join('<br>'):'No overlap signal found.'}</div></div>`}
function renderDistrictHeader(){const cols=ALL_CONGRESSES.slice().reverse(); $('districtThead').innerHTML=`<tr><th style="min-width:200px">Region</th><th style="min-width:220px">District</th>${cols.map(c=>`<th style="min-width:150px">${esc(c)}</th>`).join('')}</tr>`}
function renderDistricts(){const q=norm($('dSearchInput')?.value),reg=$('dRegionSelect')?.value||'',cong=$('dCongressSelect')?.value||'',cols=ALL_CONGRESSES.slice().reverse(); let rows='',curReg=''; DB.d.filter(d=>{if(reg&&d.region!==reg)return false; if(q&&!norm(`${d.region} ${d.district}`).includes(q))return false; if(cong&&!d.history?.[cong])return false; return true}).forEach(d=>{if(d.region!==curReg){curReg=d.region; rows+=`<tr class="region-row"><td colspan="${2+cols.length}">${esc(d.region)}</td></tr>`} rows+=`<tr><td>${esc(d.region)}</td><td style="font-weight:500">${esc(d.district)}</td>${cols.map(c=>{const names=asArray(d.history?.[c]); const isDyn=names.some(n=>findPersonByName(n)?.dy); return `<td class="${isDyn?'dynasty-cell':''}" title="${esc(names.join('; '))}">${names.length?names.map(n=>{const p=findPersonByName(n); return p?`<div class="clickable" onclick="event.stopPropagation();openModal('${esc(p.id)}')">${esc(n)}</div>`:`<div>${esc(n)}</div>`}).join(''):'—'}</td>`}).join('')}</tr>`}); $('districtTbody').innerHTML=rows||`<tr><td colspan="${2+cols.length}" style="text-align:center;padding:40px;color:var(--text3)">No districts match.</td></tr>`}
function renderDynasties(){const q=norm($('clanSearchInput')?.value||''), min=parseInt($('clanMinSelect')?.value)||2, sort=$('clanSortSelect')?.value||'members'; let clans=DB.dynasties.filter(d=>d.count>=min); if(q)clans=clans.filter(d=>norm(d.name).includes(q)); const sorters={members:(a,b)=>b.count-a.count||b.seatCount-a.seatCount,seats:(a,b)=>b.seatCount-a.seatCount,connections:(a,b)=>b.connectionScore-a.connectionScore,recent:(a,b)=>congressIndex(b.last)-congressIndex(a.last)}; clans.sort(sorters[sort]||sorters.members); $('dynastyContent').innerHTML=clans.length?clans.map(dynastyCard).join(''):emptyState('👑','No dynasty groups found.')}
function dynastyCard(d){return `<div class="dynasty-card fade-in"><div class="dynasty-head"><div><div class="dynasty-name">${esc(d.name)} Family</div><div class="dynasty-meta">${d.count} members · ${d.seatCount} seat-terms · ${esc(d.first)} to ${esc(d.last)} · ${d.regions.length} region(s)</div></div><div class="dynasty-score">${d.count}</div></div><div><span class="relation-chip">🏛 ${d.sharedDistricts.length} shared districts</span><span class="relation-chip">🔁 ${d.successions.length} succession signals</span><span class="relation-chip">🤝 ${d.overlaps.length} overlaps</span><span class="relation-chip">🗺️ ${esc(d.regions.slice(0,2).join(', '))}${d.regions.length>2?'…':''}</span></div>${renderNetwork(d)}${renderRelationshipBoxes(d)}<div class="member-list">${d.members.slice(0,10).map(m=>`<div class="member-row" onclick="openModal('${esc(m.id)}')"><div><div style="font-size:13px;font-weight:600;color:var(--text)">${esc(m.fn)}</div><div style="font-size:11px;color:var(--text3)">${esc(m.districts[0]||'')} · ${m.tt} term${m.tt!==1?'s':''}</div></div><span style="color:var(--text3)">›</span></div>`).join('')}${d.count>10?`<div style="font-size:12px;color:var(--text3);text-align:center;padding:8px">+${d.count-10} more members</div>`:''}</div></div>`}
function renderNetwork(d,focusId=null){const members=d.members.slice(0,12); if(!members.length)return ''; const ids=new Set(members.map(m=>m.id)), cx=430,cy=130,r=94,coords={}; members.forEach((m,i)=>{const ang=(Math.PI*2*i/members.length)-Math.PI/2; coords[m.id]={x:cx+Math.cos(ang)*r,y:cy+Math.sin(ang)*r}}); const lines=[]; const addLine=(a,b,type)=>{if(!ids.has(a.id)||!ids.has(b.id)||a.id===b.id)return; const key=[a.id,b.id].sort().join('|')+'|'+type; if(lines.some(l=>l.key===key))return; lines.push({key,a,b,type})}; d.sharedDistricts.forEach(x=>{for(let i=0;i<x.people.length;i++)for(let j=i+1;j<x.people.length;j++)addLine(x.people[i],x.people[j],'shared')}); d.overlaps.forEach(x=>{for(let i=0;i<x.people.length;i++)for(let j=i+1;j<x.people.length;j++)addLine(x.people[i],x.people[j],'overlap')}); d.successions.forEach(x=>addLine(x.from,x.to,'succession')); return `<div class="network-wrap"><svg class="network-svg" viewBox="0 0 860 260" role="img" aria-label="Dynasty relationship network">${lines.slice(0,34).map(l=>`<line class="network-line ${l.type}" x1="${coords[l.a.id].x}" y1="${coords[l.a.id].y}" x2="${coords[l.b.id].x}" y2="${coords[l.b.id].y}"></line>`).join('')}${members.map(m=>{const c=coords[m.id]; return `<g><circle class="network-node ${m.id===focusId?'main':''}" cx="${c.x}" cy="${c.y}" r="18"></circle><text class="network-text" x="${c.x}" y="${c.y+34}" text-anchor="middle">${esc(memberLabel(m))}</text></g>`}).join('')}</svg><div class="legend"><span><span class="legend-dot" style="background:var(--gold)"></span>Shared district</span><span><span class="legend-dot" style="background:var(--green)"></span>Consecutive terms</span><span><span class="legend-dot" style="background:var(--purple)"></span>Overlapping congress</span></div></div>`}
function renderCongressView(){const cong=$('cCongressSelect').value, reg=$('cRegionSelect').value, search=norm($('cSearchInput').value); if(!cong&&!search){$('congressContent').innerHTML=emptyState('📜','Select a Congress period above or search the overview.');return} if(cong){let members=DB.p.filter(p=>p.tr.includes(cong)&&(reg?p.regions.includes(reg):true)).sort((a,b)=>Number(b.dy)-Number(a.dy)||a.fn.localeCompare(b.fn)); const dyn=members.filter(p=>p.dy).length, families=[...new Set(members.map(p=>p.surname))].length, dynFamilies=[...new Set(members.filter(p=>p.dy).map(p=>p.cl))].length, regions=[...new Set(members.flatMap(p=>p.regions||[]))].length, tot=members.length||1; $('congressContent').innerHTML=`<div class="kpi-row" style="grid-template-columns:repeat(5,1fr);margin-bottom:20px"><div class="kpi-card" style="--accent-bar:var(--blue)"><div class="kpi-label">Members</div><div class="kpi-value">${members.length}</div><div class="kpi-sub">in ${esc(cong)}</div></div><div class="kpi-card" style="--accent-bar:var(--gold)"><div class="kpi-label">Dynasty-held Seats</div><div class="kpi-value">${(dyn/tot*100).toFixed(1)}%</div><div class="kpi-sub">${dyn} of ${members.length}</div></div><div class="kpi-card" style="--accent-bar:var(--purple)"><div class="kpi-label">Dynasty Families</div><div class="kpi-value">${dynFamilies}</div><div class="kpi-sub">of ${families} surnames</div></div><div class="kpi-card" style="--accent-bar:var(--green)"><div class="kpi-label">Regions</div><div class="kpi-value">${regions}</div><div class="kpi-sub">represented</div></div><div class="kpi-card" style="--accent-bar:var(--red)"><div class="kpi-label">District Rows</div><div class="kpi-value">${DB.d.filter(d=>d.history?.[cong]).length}</div><div class="kpi-sub">with data</div></div></div><div class="person-grid fade-in">${members.map(personCard).join('')}</div>`; return} const rows=DB.o.filter(o=>search&&norm(`${o.period} ${o.years} ${o.date} ${o.notes}`).includes(search)); $('congressContent').innerHTML=`<div class="district-table-wrap"><table><thead><tr><th>Period</th><th>Years</th><th>Date</th><th>Members</th><th>District Seats</th><th>Party-list / Sectoral Seats</th><th>Notes</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.period)}</td><td>${esc(o.years)}</td><td>${esc(o.date)}</td><td>${esc(o.members??'')}</td><td>${esc(o.district_seats??'')}</td><td>${esc(o.party_list_sectoral_seats??'')}</td><td>${esc(o.notes||'')}</td></tr>`).join('')}</tbody></table></div>`}
function showView(view){currentView=view; ['search','districts','dynasties','congress'].forEach(v=>{$('view-'+v).style.display=v===view?'':'none'}); document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',['search','districts','dynasties','congress'][i]===view)); if(view==='dynasties')renderDynasties(); if(view==='districts')renderDistricts(); if(view==='congress')renderCongressView()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()}); window.addEventListener('load',init);
