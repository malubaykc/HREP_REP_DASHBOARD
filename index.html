<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇵🇭 PH Congress Dynasty Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9922A;--gold-light:#F0C96A;--gold-dim:#8B6520;
  --navy:#0A1628;--navy2:#112240;--navy3:#1A3357;
  --surface:#0F1F38;--surface2:#162848;--surface3:#1E3254;
  --text:#E8EDF5;--text2:#A8B8CC;--text3:#6A82A0;
  --red:#E05252;--green:#3CB07A;--blue:#4A9EE0;--purple:#9B72CF;
  --border:#1E3254;--radius:12px;
  --dynasty-bg:#2A1A08;--dynasty-border:#8B6520;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--navy2)}::-webkit-scrollbar-thumb{background:var(--navy3);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--gold-dim)}
.header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 50%,#0D1F3C 100%);border-bottom:1px solid var(--gold-dim);padding:0 32px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:12px}.logo-flag{font-size:28px;line-height:1}.logo-text{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--gold-light);letter-spacing:.5px}.logo-sub{font-size:11px;color:var(--text3);font-weight:400;letter-spacing:.5px;text-transform:uppercase}.nav{display:flex;gap:4px}.nav-btn{padding:8px 16px;border:none;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;transition:all .2s;letter-spacing:.3px}.nav-btn:hover,.nav-btn.active{background:var(--surface3);color:var(--gold-light)}
.main{padding:28px 32px;max-width:1600px;margin:0 auto}.hidden{display:none!important}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:28px}.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s;cursor:default}.kpi-card:hover{border-color:var(--gold-dim);transform:translateY(-2px)}.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-bar,var(--gold))}.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:500;margin-bottom:8px}.kpi-value{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--text);line-height:1}.kpi-sub{font-size:12px;color:var(--text3);margin-top:6px}.kpi-icon{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:32px;opacity:.15}.kpi-trend{font-size:11px;margin-top:4px;font-weight:600}.kpi-trend.up{color:var(--red)}.kpi-trend.neutral{color:var(--text3)}
.search-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:24px}.search-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--gold-light);margin-bottom:16px;display:flex;align-items:center;gap:8px}.search-grid{display:grid;grid-template-columns:2fr 1.5fr 1.5fr 1fr;gap:12px;align-items:end}.field-group{display:flex;flex-direction:column;gap:6px}.field-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);font-weight:500}.search-input,.search-select{background:var(--navy2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;width:100%;transition:border-color .2s;outline:none}.search-input:focus,.search-select:focus{border-color:var(--gold-dim)}.search-input::placeholder{color:var(--text3)}.search-select option{background:var(--navy2)}.btn{padding:10px 20px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px}.btn-primary{background:var(--gold);color:var(--navy)}.btn-primary:hover{background:var(--gold-light)}.btn-ghost{background:transparent;color:var(--text3);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--text3);color:var(--text)}.search-actions{display:flex;gap:8px}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:20px;width:fit-content}.tab{padding:8px 20px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;border:none;background:transparent;color:var(--text3)}.tab.active{background:var(--surface3);color:var(--gold-light)}
.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.results-count{font-size:13px;color:var(--text3)}.results-count span{color:var(--gold-light);font-weight:600}.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}.person-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}.person-card:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}.person-card.dynasty{border-color:var(--dynasty-border);background:var(--dynasty-bg)}.person-card.dynasty::after{content:'👑';position:absolute;top:14px;right:14px;font-size:16px;opacity:.7}.pc-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px;padding-right:28px}.pc-name2{font-size:12px;color:var(--text3);margin-bottom:10px;font-family:'DM Mono',monospace}.pc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tag{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500;letter-spacing:.3px}.tag-region{background:#1E2F48;color:#7BADD4}.tag-clan{background:#2A1F00;color:var(--gold-light)}.tag-female{background:#1F1528;color:#C97EE0}.tag-male{background:#0F1E30;color:#7BADD4}.tag-speaker{background:#1A2E00;color:#7BD47B}.tag-dynasty{background:var(--dynasty-bg);color:var(--gold);border:1px solid var(--dynasty-border)}.pc-stats{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}.pc-stat{text-align:center}.pc-stat-val{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--text)}.pc-stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.district-table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}table{width:100%;border-collapse:collapse;font-size:13px}thead th{background:var(--surface2);color:var(--text2);font-weight:600;padding:12px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;z-index:2}tbody tr{border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer}tbody tr:hover{background:var(--surface2)}tbody tr.region-row{background:var(--surface3)}tbody tr.region-row td{color:var(--gold-light);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:10px 14px}tbody td{padding:10px 14px;color:var(--text2);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}tbody td:first-child{color:var(--text);font-weight:500}.dynasty-cell{color:var(--gold)!important;font-weight:600!important}.clickable{cursor:pointer}.clickable:hover{color:var(--gold-light)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}.modal-overlay.open{opacity:1;pointer-events:all}.modal{background:var(--navy2);border:1px solid var(--border);border-radius:16px;max-width:760px;width:100%;max-height:88vh;overflow-y:auto;transform:translateY(20px);transition:transform .25s}.modal-overlay.open .modal{transform:translateY(0)}.modal-header{padding:28px 32px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:var(--navy2);z-index:1}.modal-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:4px}.modal-name2{font-size:13px;color:var(--text3);font-family:'DM Mono',monospace}.modal-close{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}.modal-close:hover{background:var(--surface3);color:var(--text)}.modal-body{padding:24px 32px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}.info-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px}.info-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:4px}.info-val{font-size:14px;color:var(--text);font-weight:500}.info-val.dynasty{color:var(--gold)}.section-head{font-family:'Playfair Display',serif;font-size:15px;color:var(--gold-light);margin-bottom:12px;display:flex;align-items:center;gap:8px}.timeline{display:flex;flex-direction:column;gap:0}.tl-item{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}.tl-item:last-child{border-bottom:none}.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:4px;flex-shrink:0}.tl-period{font-family:'DM Mono',monospace;font-size:13px;color:var(--gold-light);min-width:140px;font-weight:500}.tl-detail{font-size:13px;color:var(--text2)}.tl-years{font-size:12px;color:var(--text3);margin-top:2px}
.dynasty-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:24px}.clan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.clan-card{background:var(--dynasty-bg);border:1px solid var(--dynasty-border);border-radius:10px;padding:16px;cursor:pointer;transition:all .2s}.clan-card:hover{border-color:var(--gold-light);transform:translateY(-2px)}.clan-name{font-family:'Playfair Display',serif;font-size:15px;color:var(--gold-light);margin-bottom:6px}.clan-members{font-size:12px;color:var(--text3)}.clan-count{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;color:var(--gold);float:right;margin-top:-8px}.empty{text-align:center;padding:60px 20px;color:var(--text3)}.empty-icon{font-size:40px;margin-bottom:12px}.empty-text{font-size:15px}.pagination{display:flex;gap:8px;justify-content:center;margin-top:24px;flex-wrap:wrap}.page-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text3);font-size:13px;cursor:pointer;transition:all .2s}.page-btn:hover,.page-btn.active{background:var(--surface3);color:var(--gold-light);border-color:var(--gold-dim)}.page-btn:disabled{opacity:.4;cursor:default}.section-divider{height:1px;background:var(--border);margin:24px 0}.fade-in{animation:fadeIn .3s ease-out forwards}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.search-grid{grid-template-columns:1fr 1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}.main{padding:16px}.header{padding:0 16px}.person-grid{grid-template-columns:1fr}}@media(max-width:640px){.header{height:auto;min-height:64px;padding:12px 16px;align-items:flex-start;flex-direction:column}.nav{width:100%;overflow-x:auto}.nav-btn{white-space:nowrap}.search-grid{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <div class="logo"><span class="logo-flag">🇵🇭</span><div><div class="logo-text">PH Congress Dynasty Tracker</div><div class="logo-sub">8th – 20th Congress · 1907–Present</div></div></div>
  <nav class="nav">
    <button class="nav-btn active" onclick="showView('search')">🔍 Search</button>
    <button class="nav-btn" onclick="showView('districts')">🗺️ Districts</button>
    <button class="nav-btn" onclick="showView('dynasties')">👑 Dynasties</button>
    <button class="nav-btn" onclick="showView('congress')">📜 Congress</button>
  </nav>
</header>
<main class="main">
  <div class="kpi-row" id="kpiRow"></div>
  <div id="view-search">
    <div class="search-panel"><div class="search-title">🔍 Search & Filter Legislators</div><div class="search-grid">
      <div class="field-group"><label class="field-label">Search by Name</label><input class="search-input" id="nameInput" placeholder="e.g. Marcos, Aquino, Bong, Aurora Abad…" oninput="debounceSearch()"></div>
      <div class="field-group"><label class="field-label">Filter by District</label><input class="search-input" id="districtInput" placeholder="e.g. Lone, 1st District, Batanes…" oninput="debounceSearch()"></div>
      <div class="field-group"><label class="field-label">Filter by Congress / Timeline</label><select class="search-select" id="congressSelect" onchange="doSearch()"><option value="">All Congresses</option></select></div>
      <div class="field-group"><label class="field-label">Filter</label><div class="search-actions"><select class="search-select" id="filterSelect" onchange="doSearch()" style="flex:1"><option value="">All</option><option value="multiterm">3+ Terms</option><option value="latest">20th Congress</option></select><button class="btn btn-ghost" onclick="clearSearch()">✕</button></div></div>
    </div></div>
    <div class="tabs"><button class="tab active" onclick="setCardView('cards',this)">⊞ Cards</button><button class="tab" onclick="setCardView('table',this)">≡ Table</button></div>
    <div class="results-header"><div class="results-count" id="resultsCount">Loading…</div></div><div id="cardsView"></div><div id="tableView" style="display:none"></div><div class="pagination" id="pagination"></div>
  </div>
  <div id="view-districts" style="display:none"><div class="search-panel"><div class="search-title">🗺️ District Representative History</div><div class="search-grid" style="grid-template-columns:2fr 1.5fr 1fr"><div class="field-group"><label class="field-label">Search District or Province</label><input class="search-input" id="dSearchInput" placeholder="e.g. Manila, Batanes, Cebu, 1st District…" oninput="renderDistricts()"></div><div class="field-group"><label class="field-label">Filter by Region</label><select class="search-select" id="dRegionSelect" onchange="renderDistricts()"><option value="">All Regions</option></select></div><div class="field-group"><label class="field-label">Congress</label><select class="search-select" id="dCongressSelect" onchange="renderDistricts()"><option value="">All Congresses</option></select></div></div></div><div class="district-table-wrap"><table id="districtTable"><thead id="districtThead"></thead><tbody id="districtTbody"></tbody></table></div></div>
  <div id="view-dynasties" style="display:none"><div class="search-panel"><div class="search-title">👑 Political Dynasty Families</div><div class="search-grid" style="grid-template-columns:2fr 1fr auto"><div class="field-group"><label class="field-label">Search Clan / Family</label><input class="search-input" id="clanSearchInput" placeholder="e.g. Marcos, Aquino, Romualdez…" oninput="renderDynasties()"></div><div class="field-group"><label class="field-label">Min Members</label><select class="search-select" id="clanMinSelect" onchange="renderDynasties()"><option value="2">2+</option><option value="3">3+</option><option value="5">5+</option><option value="7">7+</option></select></div><div class="field-group"><label class="field-label">&nbsp;</label><button class="btn btn-ghost" onclick="document.getElementById('clanSearchInput').value='';renderDynasties()">✕ Clear</button></div></div></div><div id="dynastyContent"></div></div>
  <div id="view-congress" style="display:none"><div class="search-panel"><div class="search-title">📜 Browse by Congress Period</div><div class="search-grid" style="grid-template-columns:1.5fr 1fr 1fr"><div class="field-group"><label class="field-label">Select Congress</label><select class="search-select" id="cCongressSelect" onchange="renderCongressView()"><option value="">Select a congress period…</option></select></div><div class="field-group"><label class="field-label">Filter by Region</label><select class="search-select" id="cRegionSelect" onchange="renderCongressView()"><option value="">All Regions</option></select></div><div class="field-group"><label class="field-label">Search overview</label><input class="search-input" id="cSearchInput" placeholder="e.g. 1987, 20th, inauguration" oninput="renderCongressView()"></div></div></div><div id="congressContent"></div></div>
</main>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)"><div class="modal" id="modal"><div class="modal-header"><div><div class="modal-name" id="modalName"></div><div class="modal-name2" id="modalName2"></div></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<script>
const DATA = { representatives:'data/representatives.json', districts:'data/districts.json', overview:'data/congress_overview.json' };
const DB = { p: [], d: [], o: [] };
const ALL_CONGRESSES = ['8th Congress','9th Congress','10th Congress','11th Congress','12th Congress','13th Congress','14th Congress','15th Congress','16th Congress','17th Congress','18th Congress','19th Congress','20th Congress'];
let ALL_REGIONS = [], searchResults = [], currentPage = 1, cardMode = 'cards', debounceTimer = null;
const PAGE_SIZE = 24;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function asArray(x){return Array.isArray(x)?x:(x?[x]:[])}
async function getJSON(path){const r=await fetch(path,{cache:'no-store'}); if(!r.ok) throw new Error(path); return r.json();}
function repToPerson(r){return {id:r.id, fn:r.name, n:r.name, n2:r.name, ak:(r.aliases||[]).join('; '), rg:(r.regions||[])[0]||'', regions:r.regions||[], di:(r.districts||[])[0]||'', districts:r.districts||[], tr:r.congresses||[], terms:r.terms||[], tt:r.term_count||0, first:r.first_congress||'', last:r.last_congress||'', cl:r.clan||'', dy:Boolean(r.clan), sx:r.sex||'', sp:Boolean(r.house_speaker), ld:r.house_leadership||'', cm:0};}
function findPersonByName(name){const n=norm(name);return DB.p.find(p=>norm(p.fn)===n || norm(p.n2)===n || (p.ak||'').split(';').some(a=>norm(a)===n));}
async function init(){
  $('kpiRow').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--text3)"><div style="font-size:28px;margin-bottom:12px">⏳</div><div style="font-size:15px;font-weight:500">Loading database…</div></div>`;
  try{
    const [reps,districts,overview] = await Promise.all([getJSON(DATA.representatives),getJSON(DATA.districts),getJSON(DATA.overview)]);
    DB.p = reps.map(repToPerson).sort((a,b)=>a.fn.localeCompare(b.fn)); DB.d = districts; DB.o = overview;
    ALL_REGIONS = [...new Set([...DB.p.flatMap(p=>p.regions||[]), ...DB.d.map(d=>d.region)].filter(Boolean))].sort();
    buildKPIs(); populateSelects(); doSearch(); renderDistrictHeader(); renderDistricts(); renderCongressView(); renderDynasties();
  }catch(e){$('kpiRow').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--red)"><div style="font-size:28px;margin-bottom:12px">⚠️</div><div style="font-size:15px;font-weight:600">Could not load data files.</div><div style="font-size:12px;margin-top:6px;color:var(--text3)">${esc(e.message)}</div></div>`}
}
function buildKPIs(){
  const latest='20th Congress', total=DB.p.length, latestMembers=DB.p.filter(p=>p.tr.includes(latest)).length, multi=DB.p.filter(p=>p.tt>=3).length, districtCount=DB.d.length, regions=ALL_REGIONS.length;
  $('kpiRow').innerHTML = [
    {label:'Representatives',val:total,sub:'unique names in database',icon:'🏛️',accent:'var(--gold)',trend:'Derived from district history'},
    {label:'20th Congress Reps',val:latestMembers,sub:'current period entries',icon:'📊',accent:'var(--red)',trend:'Based on latest column'},
    {label:'Districts',val:districtCount,sub:'district/province rows',icon:'🗺️',accent:'var(--purple)',trend:`${regions} regions represented`},
    {label:'3+ Congress Terms',val:multi,sub:'same-name grouped records',icon:'⚜️',accent:'var(--gold-light)',trend:'Across 8th–20th Congress'},
    {label:'Congress Periods',val:DB.o.length,sub:'overview reference rows',icon:'📜',accent:'var(--green)',trend:'Includes historical periods'},
  ].map(k=>`<div class="kpi-card" style="--accent-bar:${k.accent}"><div class="kpi-icon">${k.icon}</div><div class="kpi-label">${k.label}</div><div class="kpi-value">${Number(k.val).toLocaleString()}</div><div class="kpi-sub">${k.sub}</div><div class="kpi-trend neutral">${k.trend}</div></div>`).join('');
}
function populateSelects(){
  ['congressSelect','dCongressSelect','cCongressSelect'].forEach(id=>{const s=$(id); const first=s.options[0].outerHTML; s.innerHTML=first+ALL_CONGRESSES.slice().reverse().map(c=>`<option value="${c}">${c}</option>`).join('')});
  ['dRegionSelect','cRegionSelect'].forEach(id=>{const s=$(id); const first=s.options[0].outerHTML; s.innerHTML=first+ALL_REGIONS.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')});
}
function debounceSearch(){clearTimeout(debounceTimer);debounceTimer=setTimeout(doSearch,200)}
function doSearch(){const q=norm($('nameInput').value), dq=norm($('districtInput').value), cong=$('congressSelect').value, filt=$('filterSelect').value; searchResults=DB.p.filter(p=>{if(q && !norm([p.fn,p.ak].join(' ')).includes(q))return false; if(dq && !norm([...(p.districts||[]),...(p.regions||[])].join(' ')).includes(dq))return false; if(cong && !p.tr.includes(cong))return false; if(filt==='multiterm'&&p.tt<3)return false; if(filt==='latest'&&!p.tr.includes('20th Congress'))return false; return true}); currentPage=1; renderResults()}
function clearSearch(){['nameInput','districtInput'].forEach(id=>$(id).value=''); ['congressSelect','filterSelect'].forEach(id=>$(id).value=''); doSearch()}
function renderResults(){const total=searchResults.length,start=(currentPage-1)*PAGE_SIZE,page=searchResults.slice(start,start+PAGE_SIZE); $('resultsCount').innerHTML=`Showing <span>${Math.min(start+page.length,total).toLocaleString()}</span> of <span>${total.toLocaleString()}</span> legislators`; cardMode==='cards'?renderCards(page):renderTable(page); renderPagination(total)}
function renderCards(items){$('cardsView').style.display='';$('tableView').style.display='none';$('cardsView').innerHTML=items.length?`<div class="person-grid fade-in">${items.map(personCard).join('')}</div>`:emptyState('🔍','No legislators found.')}
function personCard(p){const tags=[];(p.regions||[]).slice(0,1).forEach(r=>tags.push(`<span class="tag tag-region">${esc(r)}</span>`)); if(p.dy) tags.push(`<span class="tag tag-dynasty">👑 Dynasty</span>`); if((p.aliases||[]).length) tags.push(`<span class="tag tag-clan">AKA</span>`); const first=p.first||p.tr[0]||'—', last=p.last||p.tr[p.tr.length-1]||'—'; return `<div class="person-card ${p.dy?'dynasty':''}" onclick="openModal('${esc(p.id)}')"><div class="pc-name">${esc(p.fn)}</div><div class="pc-name2">${esc((p.districts||[])[0]||'')}</div><div class="pc-tags">${tags.join('')}</div><div class="pc-stats"><div class="pc-stat"><div class="pc-stat-val">${p.tt||0}</div><div class="pc-stat-lbl">Terms</div></div><div class="pc-stat" style="text-align:left;flex:1;padding-left:16px"><div style="font-size:11px;color:var(--text3)">First: ${esc(first)}</div><div style="font-size:11px;color:var(--text3)">Last: ${esc(last)}</div></div></div></div>`}
function renderTable(items){$('cardsView').style.display='none';$('tableView').style.display=''; if(!items.length){$('tableView').innerHTML=emptyState('🔍','No results found.');return} $('tableView').innerHTML=`<div class="district-table-wrap"><table><thead><tr><th>Full Name</th><th>Region</th><th>Districts</th><th>Terms</th><th>First</th><th>Last</th></tr></thead><tbody>${items.map(p=>`<tr onclick="openModal('${esc(p.id)}')"><td>${esc(p.fn)}</td><td>${esc((p.regions||[]).join('; ')||'—')}</td><td>${esc((p.districts||[]).join('; ')||'—')}</td><td>${p.tt||0}</td><td>${esc(p.first||'—')}</td><td>${esc(p.last||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function renderPagination(total){const pages=Math.ceil(total/PAGE_SIZE); if(pages<=1){$('pagination').innerHTML='';return} let b=`<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`; pageRange(currentPage,pages).forEach(p=>{b+=p==='…'?`<span style="padding:6px 4px;color:var(--text3)">…</span>`:`<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`}); b+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`; $('pagination').innerHTML=b}
function pageRange(cur,total){if(total<=7)return Array.from({length:total},(_,i)=>i+1); if(cur<=4)return [1,2,3,4,5,'…',total]; if(cur>=total-3)return [1,'…',total-4,total-3,total-2,total-1,total]; return [1,'…',cur-1,cur,cur+1,'…',total]}
function goPage(p){const pages=Math.ceil(searchResults.length/PAGE_SIZE); if(p<1||p>pages)return; currentPage=p; renderResults(); window.scrollTo({top:180,behavior:'smooth'})}
function setCardView(mode,btn){cardMode=mode; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); renderResults()}
function emptyState(icon,text){return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-text">${text}</div></div>`}
function openModal(id){const p=DB.p.find(x=>x.id===id); if(!p)return; $('modalName').textContent=p.fn; $('modalName2').textContent=`${p.tt||0} congress term(s) · ${p.first||'—'} to ${p.last||'—'}`; const info=[['Region/Province',(p.regions||[]).join('; ')||'—'],['District(s)',(p.districts||[]).join('; ')||'—'],['Aliases',(p.ak||'—')],['Total Terms',p.tt||0],['First Congress',p.first||'—'],['Last Congress',p.last||'—']]; let html=`<div class="info-grid">${info.map(i=>`<div class="info-item"><div class="info-lbl">${esc(i[0])}</div><div class="info-val">${esc(i[1])}</div></div>`).join('')}</div>`; html+=`<div class="section-head">📅 Congress Timeline</div><div class="timeline">${(p.terms||[]).map(t=>`<div class="tl-item"><div class="tl-dot"></div><div class="tl-period">${esc(t.congress)}</div><div class="tl-detail"><strong>${esc(t.district)}</strong><div class="tl-years">${esc(t.region)} · Name used: ${esc(t.name_used)}</div></div></div>`).join('')}</div>`; $('modalBody').innerHTML=html; $('modalOverlay').classList.add('open'); document.body.style.overflow='hidden'}
function closeModal(e){if(e&&e.target!==$('modalOverlay'))return; $('modalOverlay').classList.remove('open'); document.body.style.overflow=''}
function renderDistrictHeader(){const cols=ALL_CONGRESSES.slice().reverse(); $('districtThead').innerHTML=`<tr><th style="min-width:200px">Region</th><th style="min-width:220px">District</th>${cols.map(c=>`<th style="min-width:150px">${c}</th>`).join('')}</tr>`}
function renderDistricts(){const q=norm($('dSearchInput').value), reg=$('dRegionSelect').value, cong=$('dCongressSelect').value, cols=ALL_CONGRESSES.slice().reverse(); let rows='',curReg=''; DB.d.filter(d=>{if(reg&&d.region!==reg)return false; if(q&&!norm(`${d.region} ${d.district}`).includes(q))return false; if(cong&&!d.history?.[cong])return false; return true}).forEach(d=>{if(d.region!==curReg){curReg=d.region; rows+=`<tr class="region-row"><td colspan="${2+cols.length}">${esc(d.region)}</td></tr>`} rows+=`<tr><td>${esc(d.region)}</td><td style="font-weight:500">${esc(d.district)}</td>${cols.map(c=>{const names=asArray(d.history?.[c]); return `<td title="${esc(names.join('; '))}">${names.length?names.map(n=>{const p=findPersonByName(n); return p?`<div class="clickable" onclick="openModal('${esc(p.id)}')">${esc(n)}</div>`:`<div>${esc(n)}</div>`}).join(''):'—'}</td>`}).join('')}</tr>`}); $('districtTbody').innerHTML=rows||`<tr><td colspan="${2+cols.length}" style="text-align:center;padding:40px;color:var(--text3)">No districts match.</td></tr>`}
function renderDynasties(){const q=norm($('clanSearchInput')?.value||''), min=parseInt($('clanMinSelect')?.value)||2; const groups={}; DB.p.forEach(p=>{const surname=(p.fn.split(',')[0]||'').trim(); if(!surname)return; if(!groups[surname])groups[surname]=[]; groups[surname].push(p)}); let clans=Object.entries(groups).filter(([_,m])=>m.length>=min).map(([name,members])=>({name,members,count:members.length})); if(q)clans=clans.filter(c=>norm(c.name).includes(q)); clans.sort((a,b)=>b.count-a.count); if(!clans.length){$('dynastyContent').innerHTML=emptyState('👑','No family groups found.');return} $('dynastyContent').innerHTML=clans.map(c=>`<div style="background:var(--dynasty-bg);border:1px solid var(--dynasty-border);border-radius:12px;padding:20px;margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div><div style="font-family:'Playfair Display',serif;font-size:18px;color:var(--gold-light)">${esc(c.name)}</div><div style="font-size:12px;color:var(--text3);margin-top:2px">${c.count} same-surname representative records</div></div><div style="font-family:'DM Mono',monospace;font-size:36px;color:var(--gold);opacity:.6">${c.count}</div></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px">${c.members.slice(0,8).map(m=>`<div onclick="openModal('${esc(m.id)}')" style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--navy2);border-radius:6px;cursor:pointer"><div><div style="font-size:13px;font-weight:500;color:var(--text)">${esc(m.fn)}</div><div style="font-size:11px;color:var(--text3)">${esc(m.rg||'')} · ${m.tt} term${m.tt!==1?'s':''}</div></div><span style="color:var(--text3)">›</span></div>`).join('')}${c.count>8?`<div style="font-size:12px;color:var(--text3);text-align:center;padding:8px">+${c.count-8} more members</div>`:''}</div></div>`).join('')}
function renderCongressView(){const cong=$('cCongressSelect').value, reg=$('cRegionSelect').value, search=norm($('cSearchInput').value); if(!cong&&!search){$('congressContent').innerHTML=emptyState('📜','Select a Congress period above or search the overview.');return} if(cong){let members=DB.p.filter(p=>p.tr.includes(cong)&&(reg?(p.regions||[]).includes(reg):true)); const fem=0, dyn=0, regions=[...new Set(members.flatMap(p=>p.regions||[]))].length; $('congressContent').innerHTML=`<div class="kpi-row" style="grid-template-columns:repeat(5,1fr);margin-bottom:20px"><div class="kpi-card" style="--accent-bar:var(--blue)"><div class="kpi-label">Members</div><div class="kpi-value">${members.length}</div><div class="kpi-sub">in ${esc(cong)}</div></div><div class="kpi-card" style="--accent-bar:var(--gold)"><div class="kpi-label">District Rows</div><div class="kpi-value">${DB.d.filter(d=>d.history?.[cong]).length}</div><div class="kpi-sub">with data</div></div><div class="kpi-card" style="--accent-bar:var(--purple)"><div class="kpi-label">Regions</div><div class="kpi-value">${regions}</div><div class="kpi-sub">represented</div></div><div class="kpi-card" style="--accent-bar:#C97EE0"><div class="kpi-label">Female Data</div><div class="kpi-value">—</div><div class="kpi-sub">not in CSV</div></div><div class="kpi-card" style="--accent-bar:var(--green)"><div class="kpi-label">Dynasty Data</div><div class="kpi-value">—</div><div class="kpi-sub">not in CSV</div></div></div><div class="person-grid fade-in">${members.map(personCard).join('')}</div>`; return} const rows=DB.o.filter(o=>search&&norm(`${o.period} ${o.years} ${o.date} ${o.notes}`).includes(search)); $('congressContent').innerHTML=`<div class="district-table-wrap"><table><thead><tr><th>Period</th><th>Years</th><th>Date</th><th>Members</th><th>District Seats</th><th>Party-list / Sectoral Seats</th><th>Notes</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.period)}</td><td>${esc(o.years)}</td><td>${esc(o.date)}</td><td>${esc(o.members??'')}</td><td>${esc(o.district_seats??'')}</td><td>${esc(o.party_list_sectoral_seats??'')}</td><td>${esc(o.notes||'')}</td></tr>`).join('')}</tbody></table></div>`}
function showView(view){['search','districts','dynasties','congress'].forEach(v=>{$('view-'+v).style.display=v===view?'':'none'}); document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',['search','districts','dynasties','congress'][i]===view)); if(view==='dynasties')renderDynasties(); if(view==='districts')renderDistricts(); if(view==='congress')renderCongressView()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()}); window.addEventListener('load',init);
</script>
</body>
</html>
